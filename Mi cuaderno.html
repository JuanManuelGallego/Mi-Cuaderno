*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:350;font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--soft);outline-offset:2px;border-radius:6px}
#app{max-width:560px;margin:0 auto;position:relative}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:2.6rem} h2{font-size:2rem} h3{font-size:1.25rem}
p{margin:0}
.mute{color:var(--mute)} .small{font-size:.9rem}
.hide{display:none!important}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:18px 8px;gap:12px}
.logo-h{width:150px;height:38px;background:var(--logo-h) no-repeat left center/contain}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:10px 6px 10px 0;font-size:.95rem;color:var(--mute);min-height:44px}
.mark{position:absolute;right:-70px;top:-20px;width:240px;height:240px;background:var(--logo-i) no-repeat center/contain;opacity:.13;pointer-events:none}

/* home */
.hero{padding-block:22px 18px;position:relative}
.hero .mute{margin-top:8px;max-width:30ch}
.name-in{display:flex;gap:8px;align-items:center;margin-top:14px}
.name-in input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1.5px solid var(--soft);padding:8px 2px;font-size:1rem}
.cta{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;background:var(--accent);color:var(--accent-ink);border:0;border-radius:18px;padding:18px 20px;margin-block:6px 10px}
.cta b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;display:block;line-height:1.15}
.cta span{font-size:.92rem;opacity:.85}
.grp{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:26px 0 4px;font-weight:500}

  var h=hello();
  var g=GROUPS.map(function(gr){return '<div class="grp">'+gr[0]+'</div>'+gr[1].map(function(id){var n=countOf(id);
    return '<button class="row" data-go="'+id+'"><span class="t"><b>'+esc(titleOf(id))+'</b><span class="d">'+esc(DESC[id])+'</span></span>'+(n?'<span class="n">'+n+'</span>':'')+'<span class="ch" aria-hidden="true">›</span></button>';}).join("");}).join("");
  return topbar(false)+'<div class="mark" aria-hidden="true"></div><div class="hero"><h1>'+h+'</h1><p class="mute">Este cuaderno es tuyo. Escribe lo que quieras, cuando quieras.</p>'+
   '<div class="name-in"><label for="nm" class="mute small">Tu nombre</label><input id="nm" type="text" value="'+esc(S.name)+'" placeholder="Como quieras que te diga" autocomplete="off"></div></div>'+
   '<button class="cta" data-go="termometro"><span><b>¿Cómo estás hoy?</b><span>Dos minutos para ponerle nombre</span></span><span aria-hidden="true">›</span></button>'+g+
   '<div class="grp">Con mi psicóloga</div><button class="row" data-go="export"><span class="t"><b>Compartir mis respuestas</b><span class="d">Tú eliges qué copiar y qué no</span></span><span class="ch" aria-hidden="true">›</span></button>'+
   '<div class="foot"><p>Lo que escribes se guarda solo en este aparato.'+(storageOK?'':' <b>Este navegador no está guardando nada</b>: copia tus respuestas antes de cerrar.')+'</p><button data-act="intro">Cómo funciona mi cuaderno</button></div>';
}
function hello(){var hr=new Date().getHours();var s=hr<12?"Buenos días":hr<19?"Buenas tardes":"Buenas noches";return S.name?s+",<br>"+esc(S.name):"Mi cuaderno";}

function sectionView(id){
  var sec=SECS[id], d=S.drafts[id]||(S.drafts[id]={});
  var list=(S.entries[id]||[]).slice().sort(function(a,b){return b.t-a.t;});
  var strip=id==="termometro"?weekStrip():"";
  return topbar(true)+'<div class="sechead"><h2>'+esc(sec.title)+'</h2>'+SQ+'<p>'+esc(sec.sub)+'</p></div><form id="f" novalidate>'+sec.fields.map(function(f){return fieldHTML(f,d[f.k],"f");}).join("")+
   '<div class="actions"><button class="btn" type="submit">'+esc(sec.btn)+'</button><span class="saved" id="ok" role="status"></span></div></form><div id="after"></div>'+
   '<div class="hist"><h3>Lo que he escrito</h3>'+strip+(list.length?list.map(function(e){return entryHTML(sec,e);}).join(""):'<p class="empty">Todavía no hay nada aquí. Cuando guardes algo, aparece en esta lista.</p>')+'</div>';
}
function weekStrip(){
  var days=[],now=new Date();now.setHours(0,0,0,0);
  for(var i=6;i>=0;i--){var d=new Date(now);d.setDate(now.getDate()-i);days.push(d);}
  var list=S.entries.termometro||[];
  var cells=days.map(function(d){var s=d.getTime(),e=s+864e5;var v=list.filter(function(x){return x.t>=s&&x.t<e&&typeof x.v.int==="number";});
    var avg=v.length?v.reduce(function(a,x){return a+x.v.int;},0)/v.length:null;
    return '<div><i title="'+(avg==null?"sin registro":Math.round(avg)+" de 10")+'">'+(avg==null?'':'<b style="height:'+Math.max(8,avg*10)+'%"></b>')+'</i>'+d.toLocaleDateString("es-CO",{weekday:"narrow"})+'</div>';}).join("");
  return '<p class="mute small">Intensidad promedio de los últimos 7 días</p><div class="week" aria-hidden="true">'+cells+'</div>';
}

function peopleView(){
  var d=S.drafts.personas||(S.drafts.personas={name:"",ring:""});
  return topbar(true)+'<div class="sechead"><h2>Las personas de mi vida</h2>'+SQ+'<p>Yo estoy en el centro. Mientras más cerca me siento de alguien, más cerca del centro. Agrega a una persona a la vez, no hay que hacerlo todo hoy.</p></div>'+
   mapSVG()+'<form id="pf" novalidate><div class="fld"><label for="pn">Nombre de la persona</label><input type="text" id="pn" data-k="name" value="'+esc(d.name||"")+'" autocomplete="off"></div>'+
   '<div class="fld"><span class="lb" id="pr_l">¿Qué tan cerca me siento hoy?</span><div class="chips" role="group" aria-labelledby="pr_l" data-k="ring" data-multi="0">'+RINGS.map(function(r){return '<button type="button" class="chip'+(d.ring===r?' on':'')+'" aria-pressed="'+(d.ring===r)+'" data-v="'+r+'">'+r+'</button>';}).join("")+'</div></div>'+
   '<div class="actions"><button class="btn" type="submit">Agregar al mapa</button></div></form>'+
   '<div class="hist"><h3>Mis personas</h3>'+(S.people.length?S.people.map(personCard).join(""):'<p class="empty">Cuando agregues a alguien, aparece aquí y puedes escribir sobre esa relación.</p>')+'</div>';
}
function mapSVG(){
  var rs=[36,66,96],P=S.people,ringIdx={"muy cerca":0,"cerca":1,"lejos":2},byR=[[],[],[]];
  P.forEach(function(p){byR[ringIdx[p.ring]==null?1:ringIdx[p.ring]].push(p);});
  var dots="";
  byR.forEach(function(arr,ri){var rad=ri===0?52:ri===1?81:108;arr.forEach(function(p,i){
    var a=(-90+(360/Math.max(arr.length,1))*i+ri*35)*Math.PI/180,x=110+rad*Math.cos(a),y=110+rad*Math.sin(a);
    dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4.5" fill="var(--accent)"/><text x="'+x.toFixed(1)+'" y="'+(y+(Math.sin(a)>0?15:-8)).toFixed(1)+'" text-anchor="middle" font-size="9.5" fill="var(--ink)" stroke="var(--bg)" stroke-width="3" paint-order="stroke">'+esc(p.name.length>12?p.name.slice(0,11)+"…":p.name)+'</text>';});});
  return '<svg class="map" viewBox="-22 -4 264 228" role="img" aria-label="Mapa de mis personas: '+P.length+' personas"><circle cx="110" cy="110" r="108" fill="none" stroke="var(--soft)" stroke-width="1.2" stroke-dasharray="3 4"/><circle cx="110" cy="110" r="78" fill="none" stroke="var(--soft)" stroke-width="1.2" stroke-dasharray="3 4"/><circle cx="110" cy="110" r="46" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.4"/><text x="110" y="118" text-anchor="middle" font-family="Krylon,serif" font-size="24" fill="var(--ink)">yo</text>'+dots+'</svg>';
}
function personCard(p){
  var f=PERSON_F.map(function(x){return fieldHTML(x,p.v&&p.v[x.k],"p"+p.id);}).join("");
  return '<details class="pcard" data-pid="'+p.id+'"><summary><b>'+esc(p.name)+'</b><span class="mute small">'+esc(p.ring)+'</span></summary><div class="form" style="margin-top:14px">'+f+
   '<div class="fld"><span class="lb">Qué tan cerca</span><div class="chips" data-k="__ring" data-multi="0">'+RINGS.map(function(r){return '<button type="button" class="chip'+(p.ring===r?' on':'')+'" data-v="'+r+'" aria-pressed="'+(p.ring===r)+'">'+r+'</button>';}).join("")+'</div></div>'+
   '<div class="actions"><span class="saved" role="status"></span><span class="delwrap"><button class="del" data-delp="'+p.id+'">Quitar del mapa</button></span></div></div></details>';
}

function escaleraView(){
  var h=STEPS.map(function(s,i){var st=S.steps[i]||{};var opts=function(sel){var o='<option value="">–</option>';for(var k=0;k<=10;k++)o+='<option value="'+k+'"'+(String(sel)===String(k)?' selected':'')+'>'+k+'</option>';return o;};
   return '<div class="step'+(st.done?' done':'')+'" data-i="'+i+'"><div class="num" aria-hidden="true">'+(i+1)+'</div><div><b>'+esc(s)+'</b><div class="nums"><label class="ck"><input type="checkbox" data-f="done"'+(st.done?' checked':'')+'> Ya lo hice</label>'+
    '<label>Miedo antes <select data-f="b" aria-label="Miedo antes, escalón '+(i+1)+'">'+opts(st.b)+'</select></label><label>después <select data-f="a" aria-label="Miedo después, escalón '+(i+1)+'">'+opts(st.a)+'</select></label></div></div></div>';}).join("");
  return topbar(true)+'<div class="sechead"><h2>Mi escalera</h2>'+SQ+'<p>Un escalón a la vez, a mi ritmo. Se puede repetir el mismo escalón varias veces. Estos escalones son una propuesta: los ajustamos juntas en consulta. No subo al siguiente hasta que el anterior dé menos miedo.</p></div>'+h+
   '<div class="gentle"><p><b>Mi truco para calmarme</b></p><p class="mute">Respiro contando 4 al inhalar y 6 al exhalar, y pienso en un lugar donde me siento tranquila. El botón “Necesito ayuda” tiene una guía para respirar.</p></div>';
}

function planView(){
  return topbar(true)+'<div class="sechead"><h2>Cuando me siento muy mal</h2>'+SQ+'<p>A veces el dolor se vuelve tan grande que aparecen ganas de desaparecer o de no seguir. Pasa, y no estás sola con eso. Este plan lo armamos juntas en consulta. Lo que escribas aquí se guarda solo y aparece en el botón “Necesito ayuda”.</p></div>'+
   '<div class="callout"><b>Si estás en peligro ahora mismo</b><br>Díselo a un adulto que esté cerca y llama al <b>123</b>. Línea de salud mental: <b>192, opción 4</b>.</div>'+
   '<div class="form">'+PLAN_F.map(function(f){return fieldHTML({k:f.k,t:"area",l:f.l,h:f.h},S.plan[f.k],"pl");}).join("")+'<div class="actions"><span class="saved" id="ok" role="status"></span></div></div>';
}

function exportView(){
  var ids=Object.keys(SECS).concat(["personas","escalera","plan"]);
  var boxes=ids.map(function(id){var n=countOf(id);if(!n)return "";var def=id!=="carta";
    return '<label class="ck"><input type="checkbox" data-sec="'+id+'"'+(def?' checked':'')+'> '+esc(id==="carta"?"Cartas (privadas)":titleOf(id))+' <span class="mute small">('+n+')</span></label>';}).join("");
  return topbar(true)+'<div class="sechead"><h2>Compartir con mi psicóloga</h2>'+SQ+'<p>Tu cuaderno es privado. Aquí armas un resumen con lo que tú decidas y lo copias para mandarlo o leerlo en la consulta. Las cartas empiezan sin marcar.</p></div>'+
   (boxes?'<div class="fld"><span class="lb">¿Qué quiero incluir?</span><div class="sel">'+boxes+'</div></div>'+
   '<div class="fld"><label for="per">¿De cuándo?</label><select id="per"><option value="7">Últimos 7 días</option><option value="30" selected>Últimos 30 días</option><option value="0">Todo</option></select></div>'+
   '<div class="actions" style="margin-top:20px"><button class="btn" id="mk">Armar resumen</button></div><div id="res" style="margin-top:18px"></div>':'<p class="empty">Cuando tengas cosas escritas, podrás armar un resumen aquí.</p>')+
   '<div class="hist"><h3>Borrar todo</h3><p class="mute small">Esto borra todo lo que hay en este cuaderno, en este aparato. No se puede deshacer.</p><div class="actions" style="margin-top:10px" id="wipe"><button class="btn ghost sm" data-act="wipe1">Borrar mi cuaderno</button></div></div>';
}

function summary(secs,days){
  var since=days?Date.now()-days*864e5:0,out=["MI CUADERNO · resumen"+(S.name?" de "+S.name:""),"Armado el "+fmt(Date.now()),""];
  secs.forEach(function(id){
    if(SECS[id]){var l=(S.entries[id]||[]).filter(function(e){return e.t>=since;}).sort(function(a,b){return a.t-b.t;});if(!l.length)return;
      out.push("== "+SECS[id].title.toUpperCase()+" ==");
      l.forEach(function(e){out.push("["+fmt(e.t)+"]");SECS[id].fields.forEach(function(f){var v=e.v[f.k];if(Array.isArray(v)?v.length:(v!==""&&v!=null))out.push("· "+f.s+": "+valText(f,v));});out.push("");});}
    else if(id==="personas"){if(!S.people.length)return;out.push("== LAS PERSONAS DE MI VIDA ==");S.people.forEach(function(p){out.push("· "+p.name+" ("+p.ring+")");PERSON_F.forEach(function(f){var v=p.v&&p.v[f.k];if(v)out.push("    "+f.s+": "+v);});});out.push("");}
    else if(id==="escalera"){out.push("== MI ESCALERA ==");STEPS.forEach(function(s,i){var st=S.steps[i];if(st&&(st.done||st.b||st.a))out.push((i+1)+". "+s+" — "+(st.done?"hecho":"pendiente")+(st.b?", miedo antes "+st.b:"")+(st.a?", después "+st.a:""));});out.push("");}
    else if(id==="plan"){out.push("== MI PLAN: CUANDO ME SIENTO MUY MAL ==");PLAN_F.forEach(function(f){if(S.plan[f.k])out.push("· "+f.l+": "+S.plan[f.k]);});out.push("");}
  });
  return out.join("\n").trim();
}

/* ---------- rendering + events ---------- */
function render(){
  var app=$("#app"),h;
  if(view==="home")h=home();
  else if(view==="personas")h=peopleView();
  else if(view==="escalera")h=escaleraView();
  else if(view==="plan")h=planView();
  else if(view==="export")h=exportView();
  else h=sectionView(view);
  app.innerHTML=h;window.scrollTo(0,0);
  bindView();
}
function go(v){view=v;render();}

function bindView(){
  if(view==="home"){var nm=$("#nm");nm.addEventListener("input",function(){S.name=nm.value.trim();save();});
    nm.addEventListener("change",function(){var h1=$(".hero h1");if(h1)h1.innerHTML=hello();});}
  else if(SECS[view]){
    var id=view,d=S.drafts[id]||(S.drafts[id]={});
    bindFields($("#f"),function(k){return d[k];},function(k,v){d[k]=v;save();});
    $("#f").addEventListener("submit",function(e){e.preventDefault();if(!hasContent(d)){flash("Escribe o marca algo primero");return;}
      var entry={id:uid(),t:Date.now(),v:JSON.parse(JSON.stringify(d))};(S.entries[id]=S.entries[id]||[]).push(entry);S.drafts[id]={};save();
      var care=(id==="semana"&&(entry.v.ganas==="algunas veces"||entry.v.ganas==="varias veces"))||(id==="termometro"&&typeof entry.v.int==="number"&&entry.v.int>=9);
      render();flash("Guardado");if(care)showCare();});
  }
  else if(view==="personas"){
    var d2=S.drafts.personas||(S.drafts.personas={name:"",ring:""});
    bindFields($("#pf"),function(k){return d2[k];},function(k,v){d2[k]=v;save();});
    $("#pf").addEventListener("submit",function(e){e.preventDefault();var n=(d2.name||"").trim();if(!n||!d2.ring){flash("Falta el nombre o qué tan cerca está");return;}
      S.people.push({id:uid(),name:n,ring:d2.ring,v:{}});S.drafts.personas={name:"",ring:""};save();render();flash("Agregada al mapa");});
    $$(".pcard").forEach(function(c){var p=S.people.filter(function(x){return x.id===c.dataset.pid;})[0];if(!p)return;
      bindFields(c,function(k){return k==="__ring"?p.ring:(p.v||{})[k];},function(k,v){if(k==="__ring"){p.ring=v||p.ring;var m=$("svg.map");var tmp=document.createElement("div");tmp.innerHTML=mapSVG();m.replaceWith(tmp.firstChild);$("summary .mute",c).textContent=p.ring;}else{p.v=p.v||{};p.v[k]=v;}save();});
    });
  }
  else if(view==="escalera"){
    $$(".step").forEach(function(s){var i=s.dataset.i;s.addEventListener("change",function(e){var f=e.target.dataset.f;if(!f)return;var st=S.steps[i]=S.steps[i]||{};
      st[f]=f==="done"?e.target.checked:e.target.value;if(f==="done")s.classList.toggle("done",st.done);save();});});
  }
  else if(view==="plan"){
    var ok=$("#ok");bindFields($(".form"),function(k){return S.plan[k];},function(k,v){S.plan[k]=v;save();ok.textContent="Guardado en este aparato";});
  }
  else if(view==="export"){
    var mk=$("#mk");if(mk)mk.addEventListener("click",function(){
      var secs=$$("input[data-sec]:checked").map(function(x){return x.dataset.sec;});if(!secs.length){flash("Marca al menos una sección");return;}
      var txt=summary(secs,+$("#per").value),res=$("#res");
      res.innerHTML='<label class="lb" for="out" style="font-weight:500;display:block;margin-bottom:8px">Léelo antes de compartirlo</label><textarea id="out" class="out" readonly></textarea><div class="actions" style="margin-top:12px"><button class="btn" id="cp">Copiar resumen</button><span class="saved" id="cpok" role="status"></span></div>';
      var ta=$("#out");ta.value=txt||"No hay nada escrito en ese período.";
      $("#cp").addEventListener("click",function(){var done=function(){$("#cpok").textContent="Copiado. Pégalo en un mensaje o léelo en la consulta.";};
        var fb=function(){ta.focus();ta.select();try{if(document.execCommand("copy"))done();else $("#cpok").textContent="Selecciónalo y cópialo con tu teléfono.";}catch(e){$("#cpok").textContent="Selecciónalo y cópialo con tu teléfono.";}};
        if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,fb);}else fb();});
    });
  }
}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-go]");if(t){go(t.dataset.go);return;}
  var a=e.target.closest("[data-act]");
  if(a){var k=a.dataset.act;
    if(k==="intro")showIntro();
    else if(k==="sos")showSOS();
    else if(k==="close"){closeLayer();}
    else if(k==="wipe1"){$("#wipe").innerHTML='<span class="small">¿Seguro?</span> <button class="btn sm" data-act="wipe2">Sí, borrar todo</button> <button class="btn ghost sm" data-act="wipe0">No</button>';}
    else if(k==="wipe0"){$("#wipe").innerHTML='<button class="btn ghost sm" data-act="wipe1">Borrar mi cuaderno</button>';}
    else if(k==="wipe2"){S=blank();save();view="home";render();flash("Cuaderno borrado");}
    return;}
  var d=e.target.closest("[data-del]");
  if(d){var w=d.parentNode;w.innerHTML='<button class="del" data-del2="'+d.dataset.del+'">Sí, borrar</button><button class="del" data-delno="1">No</button>';return;}
  var d2=e.target.closest("[data-del2]");
  if(d2){var id=d2.dataset.del2;S.entries[view]=(S.entries[view]||[]).filter(function(x){return x.id!==id;});save();render();return;}
  if(e.target.closest("[data-delno]")){render();return;}
  var dp=e.target.closest("[data-delp]");
  if(dp){var w2=dp.parentNode;w2.innerHTML='<button class="del" data-delp2="'+dp.dataset.delp+'">Sí, quitar</button><button class="del" data-delno="1">No</button>';return;}
  var dp2=e.target.closest("[data-delp2]");
  if(dp2){S.people=S.people.filter(function(x){return x.id!==dp2.dataset.delp2;});save();render();return;}
});

function flash(msg){var old=$(".toast");if(old)old.remove();var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(function(){t.remove();},2400);}
function closeLayer(){clearTimeout(breatheT);$("#layer").innerHTML="";}

function showIntro(){
  $("#layer").innerHTML='<div class="intro" role="dialog" aria-modal="true" aria-labelledby="it"><div><h2 id="it">Hola</h2>'+SQ+'<ul><li>Este cuaderno es tuyo. No hay respuestas buenas ni malas, y nadie lo califica.</li><li>Lo que escribes se guarda <b>solo en este celular o computador</b>. Tu psicóloga no lo ve a menos que tú copies un resumen y se lo compartas.</li><li>Si borras los datos del navegador o abres el cuaderno en otro aparato, no vas a encontrar lo que escribiste.</li><li>Si un día lo que compartas me muestra que estás en peligro, voy a avisar a un adulto que te cuide, porque me importas.</li><li>Si algo se pone muy pesado, toca <b>Necesito ayuda</b>, abajo a la derecha.</li></ul><p class="hand" style="font-family:var(--f-display);font-size:1.4rem">Manuela</p><div class="actions" style="margin-top:16px"><button class="btn" data-act="close" id="introok">Entendido</button></div></div></div>';
  S.seenIntro=true;save();var b=$("#introok");if(b)b.focus();
}
function showCare(){
  var box=$("#after");if(!box)return;
  box.innerHTML='<div class="gentle"><p><b>Gracias por contarlo.</b> Esto es importante para hablarlo en la consulta. Si ahora mismo te sientes mal o en peligro, toca el botón de abajo.</p><div class="actions" style="margin-top:10px"><button class="btn sm" data-act="sos">Necesito ayuda</button></div></div>';
}
function showSOS(){
  var p=PLAN_F.filter(function(f){return S.plan[f.k];}).map(function(f){return '<dt>'+esc(f.l)+'</dt><dd>'+esc(S.plan[f.k])+'</dd>';}).join("");
  $("#layer").innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh"><div><button class="back" data-act="close" aria-label="Cerrar">← Volver</button><h2 id="sh">Estás aquí, y eso cuenta</h2>'+SQ+
  '<div class="callout"><b>Si estás en peligro ahora mismo</b><br>Díselo a un adulto que esté cerca y llama al <a href="tel:123">123</a>.<br>Línea de salud mental: <a href="tel:192">192</a>, opción 4.</div>'+
  '<div class="breathe" aria-live="off"><div class="orb" aria-hidden="true"></div><p id="bt">Inhala… 4</p><p class="mute small">Inhala 4 segundos, exhala 6. Repite varias veces.</p></div>'+
  '<h3>Mi plan</h3>'+(p?'<dl class="plan">'+p+'</dl>':'<p class="empty">Todavía no has llenado tu plan. Lo armamos juntas en consulta.</p>')+
  '<div class="actions" style="margin-top:18px"><button class="btn ghost sm" data-act="close" data-go="plan">'+(p?'Editar mi plan':'Llenar mi plan')+'</button></div></div></div>';
  var seq=[["Inhala… 4",4000],["Exhala… 6",6000]],i=0,bt=$("#bt");
  clearTimeout(breatheT);(function tick(){breatheT=setTimeout(function(){i=(i+1)%2;if(bt)bt.textContent=seq[i][0];tick();},seq[i][1]);})();
  var first=$(".sheet .back");if(first)first.focus();
}
document.addEventListener("click",function(e){var x=e.target.closest(".sheet [data-go]");if(x)closeLayer();},true);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("#layer").innerHTML)closeLayer();});

var sosBtn=document.createElement("button");sosBtn.className="sos";sosBtn.dataset.act="sos";sosBtn.textContent="Necesito ayuda";document.body.appendChild(sosBtn);
render();
if(!S.seenIntro)showIntro();
})();
</script>

</body></html>
